name: startale_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  equatable: ^2.0.7

  # Routing & Networking
  go_router: ^14.8.1
  dio: ^5.8.0
  http: ^1.2.0
  flutter_dotenv: ^5.2.1

  # Storage & Cache
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  flutter_cache_manager: ^3.4.1

  # Audio & Media
  just_audio: ^0.9.46
  audio_session: ^0.1.25

  # UI, Fonts & Hardware
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  permission_handler: ^11.4.0

  # DTO Annotations
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - environments/.env.development
    - environments/.env.staging
    - environments/.env.production
    - assets/demo/
